openapi: 3.1.0
info:
  title: Penaup Runtime API
  version: 0.1.0
  description: |
    花生片 Penaup 的用户、设备、媒体和显影状态接口。
    照片本体不经过 MQTT；Web、微信小程序和未来 iOS 使用同一套 transfer 状态。
  license:
    name: Poboll Non-Commercial License v1.0
    identifier: LicenseRef-Poboll-NonCommercial
servers:
  - url: https://penaup.example.com
    description: 生产部署示例
  - url: http://127.0.0.1:8787
    description: 本地运行时
tags:
  - name: auth
  - name: devices
  - name: media
  - name: albums
  - name: templates
  - name: streams
  - name: transfers
  - name: events
  - name: settings
  - name: ai
  - name: integrations
  - name: device
  - name: health
paths:
  /health:
    get:
      tags: [health]
      security: []
      summary: 运行时存活检查
      responses:
        '200':
          description: 服务进程可接受健康检查
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [health]
      security: []
      summary: 数据库与媒体目录就绪检查
      responses:
        '200':
          description: 数据库完整性与媒体目录可写
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503': { description: 运行时未就绪 }
  /api/v1/auth/challenges:
    post:
      tags: [auth]
      security: []
      summary: 发送邮箱一次性验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '202':
          description: 验证码已交给邮件 provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '403': { description: 需要邀请 }
        '429': { description: 频率限制 }
  /api/v1/auth/verify:
    post:
      tags: [auth]
      security: []
      summary: 验证一次性验证码并创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Bearer 与 refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { description: 验证码错误 }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 轮换 refresh token
      description: 浏览器 Cookie 请求需要 X-CSRF-Token；小程序/iOS 可使用 Bearer refresh token。
      security:
        - BearerAuth: []
        - CookieSession: []
      responses:
        '200':
          description: 新会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { description: refresh token 无效 }
        '403': { description: CSRF 缺失 }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 注销当前会话
      security:
        - BearerAuth: []
        - CookieSession: []
      responses:
        '200': { description: 已注销 }
        '403': { description: CSRF 缺失 }
  /api/v1/me:
    get:
      tags: [auth]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 当前用户
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { description: 未登录 }
  /api/v1/devices:
    get:
      tags: [devices]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 当前用户的设备
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
  /api/v1/devices/{deviceId}/claim:
    post:
      tags: [devices]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 认领已登记设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { description: 已认领设备 }
        '409': { description: 已被其他用户认领 }
  /api/v1/devices/{deviceId}/commands:
    post:
      tags: [devices]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 向设备下发命令
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommandRequest'
      responses:
        '200': { description: 命令已入队 }
        '404': { description: 设备不属于当前用户 }
        '503': { description: 队列或 MQTT 不可用 }
  /api/v1/devices/{deviceId}/sync:
    post:
      tags: [devices]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 让设备同步当前用户最新 film
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { description: 同步命令已入队 }
        '404': { description: 设备或最新 film 不存在 }
        '503': { description: 队列或 MQTT 不可用 }
  /api/v1/media:
    post:
      tags: [media]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 上传图片或 film
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                album_id: { type: integer, minimum: 1 }
      responses:
        '200': { description: 媒体已保存 }
        '413': { description: 超过用户配额或请求限制 }
        '415': { description: 媒体类型不支持 }
    get:
      tags: [media]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 当前用户媒体索引
      responses:
        '200': { description: 媒体列表 }
  /api/v1/media/{mediaId}/download:
    get:
      tags: [media]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 下载当前用户的私有媒体
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200': { description: 媒体文件流 }
        '404': { description: 媒体或文件不存在 }
  /api/v1/albums:
    post:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 创建相册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
      responses:
        '200': { description: 相册已创建 }
        '413': { description: 请求体过大 }
    get:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 列出当前用户相册
      responses:
        '200':
          description: 相册列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumListResponse'
  /api/v1/albums/{albumId}:
    get:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 获取相册与照片索引
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      responses:
        '200': { description: 相册详情 }
        '404': { description: 相册不存在或不属于当前用户 }
    put:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新相册
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
      responses:
        '200': { description: 相册已更新 }
        '404': { description: 相册不存在或不属于当前用户 }
    patch:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 部分更新相册
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumRequest'
      responses:
        '200': { description: 相册已更新 }
        '404': { description: 相册不存在或不属于当前用户 }
    delete:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 删除相册及其媒体文件
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      responses:
        '200': { description: 相册已删除 }
        '404': { description: 相册不存在或不属于当前用户 }
  /api/v1/albums/{albumId}/photos:
    get:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 列出相册照片
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      responses:
        '200': { description: 照片列表 }
        '404': { description: 相册不存在或不属于当前用户 }
    post:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 上传一张照片到相册
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 照片已加入相册 }
        '404': { description: 相册不存在或不属于当前用户 }
        '415': { description: 仅支持图片 }
  /api/v1/albums/{albumId}/photos/{photoId}/file:
    get:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 读取相册照片原图
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200': { description: 私有图片文件流 }
        '404': { description: 照片或文件不存在 }
  /api/v1/albums/{albumId}/photos/{photoId}:
    delete:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 删除相册照片
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200': { description: 照片已删除 }
        '404': { description: 照片不存在或不属于当前用户 }
  /api/v1/albums/{albumId}/photos/sort:
    post:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新相册照片顺序
      parameters:
        - $ref: '#/components/parameters/AlbumId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortIdsRequest'
      responses:
        '200': { description: 照片顺序已更新 }
        '400': { description: photo_ids 无效 }
  /api/v1/albums/{albumId}/photos/{photoId}/layout:
    put:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新照片裁切布局
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200': { description: 布局已更新 }
        '404': { description: 照片不存在或不属于当前用户 }
    patch:
      tags: [albums]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 部分更新照片裁切布局
      parameters:
        - $ref: '#/components/parameters/AlbumId'
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200': { description: 布局已更新 }
        '404': { description: 照片不存在或不属于当前用户 }
  /api/v1/templates:
    post:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 创建模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '200': { description: 模板已创建 }
        '413': { description: 请求体过大 }
    get:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 列出当前用户可用模板
      responses:
        '200': { description: 模板列表 }
  /api/v1/templates/{templateId}:
    get:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 获取模板
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200': { description: 模板详情 }
        '404': { description: 模板不存在 }
    put:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新模板
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '200': { description: 模板已更新 }
        '404': { description: 模板不存在或为内置模板 }
    patch:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 部分更新模板
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '200': { description: 模板已更新 }
        '404': { description: 模板不存在或为内置模板 }
    delete:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 删除用户模板
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200': { description: 模板已删除 }
        '404': { description: 模板不存在或为内置模板 }
  /api/v1/templates/{templateId}/preview:
    get:
      tags: [templates]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 获取模板的客户端 film 渲染预览契约
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Profile'
      responses:
        '200': { description: 模板预览参数 }
        '404': { description: 模板不存在 }
  /api/v1/streams:
    post:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 创建轮播片单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRequest'
      responses:
        '200': { description: 片单已创建 }
        '413': { description: 请求体过大 }
    get:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 列出当前用户片单
      responses:
        '200': { description: 片单列表 }
  /api/v1/streams/{streamId}:
    get:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 获取片单及项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200': { description: 片单详情 }
        '404': { description: 片单不存在 }
    put:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新片单
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRequest'
      responses:
        '200': { description: 片单已更新 }
        '404': { description: 片单不存在 }
    patch:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 部分更新片单
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRequest'
      responses:
        '200': { description: 片单已更新 }
        '404': { description: 片单不存在 }
    delete:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 删除片单
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200': { description: 片单已删除 }
        '404': { description: 片单不存在 }
  /api/v1/streams/{streamId}/items:
    post:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 向片单加入模板项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamItemRequest'
      responses:
        '200': { description: 项目已加入 }
        '404': { description: 片单或模板不存在 }
  /api/v1/streams/{streamId}/items/{itemId}:
    put:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新片单项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/StreamItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamItemRequest'
      responses:
        '200': { description: 项目已更新 }
        '404': { description: 项目不存在 }
    patch:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 部分更新片单项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/StreamItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamItemRequest'
      responses:
        '200': { description: 项目已更新 }
        '404': { description: 项目不存在 }
    delete:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 从片单移除项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/StreamItemId'
      responses:
        '200': { description: 项目已移除 }
        '404': { description: 项目不存在 }
  /api/v1/streams/{streamId}/items/sort:
    post:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 更新片单项目顺序
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortIdsRequest'
      responses:
        '200': { description: 项目顺序已更新 }
        '400': { description: item_ids 无效 }
  /api/v1/streams/{streamId}/devices:
    post:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 绑定片单设备
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceIdsRequest'
      responses:
        '200': { description: 设备绑定已更新 }
        '400': { description: device_ids 无效 }
  /api/v1/streams/{streamId}/push:
    post:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 立即推送片单项目
      parameters:
        - $ref: '#/components/parameters/StreamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamPushRequest'
      responses:
        '202': { description: 推送任务已入队 }
        '404': { description: 片单不存在 }
        '503': { description: 任务队列已满或设备不可用 }
  /api/v1/streams/{streamId}/timeline:
    get:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 获取片单时间轴
      parameters:
        - $ref: '#/components/parameters/StreamId'
      responses:
        '200': { description: 启用项目与起止秒数 }
        '404': { description: 片单不存在 }
  /api/v1/pushes:
    get:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 查询当前用户推送历史
      parameters:
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/StreamFilter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 推送记录列表 }
  /api/v1/streams/{streamId}/pushes:
    get:
      tags: [streams]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 查询片单推送历史
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 推送记录列表 }
        '404': { description: 片单不存在 }
  /api/v1/transfers:
    post:
      tags: [transfers]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 创建显影传输记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreateRequest'
      responses:
        '202': { description: 传输已创建 }
    get:
      tags: [transfers]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 当前用户传输历史
      responses:
        '200': { description: 传输列表 }
  /api/v1/transfers/{transferId}:
    get:
      tags: [transfers]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 查询一次显影状态
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200': { description: 当前状态 }
        '404': { description: transfer 不存在 }
  /api/v1/transfers/{transferId}/retry:
    post:
      tags: [transfers]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 重试失败的显影
      description: device_state_uncertain 必须先由用户确认设备画面，不能自动重试。
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '202': { description: 新 transfer 已创建 }
        '409': { description: 当前状态不可重试 }
  /api/v1/transfers/{transferId}/events:
    post:
      tags: [transfers]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 写入客户端可证明的传输阶段
      description: 客户端不能直接伪造 succeeded；设备刷新确认必须来自可信设备桥接层。
      parameters:
        - $ref: '#/components/parameters/TransferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferEvent'
      responses:
        '200': { description: 状态已更新 }
        '409': { description: 状态跃迁非法或需要设备确认 }
  /api/v1/events/stream:
    get:
      tags: [events]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: SSE 实时事件
      description: iOS 可用 URLSession bytes/AsyncStream 消费；断线后使用 transfer 查询接口补齐状态。
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: event 行包含 type 与 JSON data
        '401': { description: 未登录 }
  /api/v1/settings:
    get:
      tags: [settings]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 读取用户界面设置
      responses:
        '200': { description: 设置对象 }
    put:
      tags: [settings]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 保存用户界面设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200': { description: 设置已保存 }
        '413': { description: 请求体过大 }
  /api/v1/ai/providers:
    get:
      tags: [ai]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 列出可用 AI provider 状态
      responses:
        '200': { description: provider 状态 }
  /api/v1/ai/settings:
    get:
      tags: [ai]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 读取用户 AI 设置
      responses:
        '200': { description: AI 设置 }
    put:
      tags: [ai]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 保存用户 AI 设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200': { description: AI 设置已保存 }
        '413': { description: 请求体过大 }
  /api/v1/ai/generate:
    post:
      tags: [ai]
      security:
        - BearerAuth: []
        - CookieSession: []
      summary: 通过受信任的 AI provider 生成模板数据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200': { description: provider 返回的安全结果 }
        '413': { description: 请求体过大 }
        '503': { description: provider 未配置或不可用 }
  /api/v1/integrations/weread/snapshot:
    post:
      tags: [integrations]
      security:
        - WereadSkillKey: []
      summary: 生成微信读书 Pro 屏保摘要
      description: |
        使用请求头中的临时 Skill Key 向微信读书取回周报或月报最小摘要。
        Key 不进入 URL、数据库或响应；响应禁止缓存。
      parameters:
        - $ref: '#/components/parameters/WereadSkillKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WereadSnapshotRequest'
      responses:
        '200':
          description: PENAUP_PRO 屏保摘要
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WereadSnapshotResponse'
        '400': { description: Key、mode 或请求体无效 }
        '401': { description: 微信读书 Key 被拒绝 }
        '413': { description: 请求体过大 }
        '429': { description: 频率限制 }
        '502': { description: 微信读书返回异常 }
        '504': { description: 微信读书请求超时 }
  /api/v1/device/heartbeat:
    get:
      tags: [device]
      security: []
      summary: 旧固件 HTTP 心跳与命令领取
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/DeviceTokenQuery'
        - { $ref: '#/components/parameters/DeviceModelQuery' }
        - { $ref: '#/components/parameters/BatteryQuery' }
        - { $ref: '#/components/parameters/DeviceStateQuery' }
      responses:
        '200': { description: 心跳成功并返回待执行命令 }
        '400': { description: 缺少 device_id }
        '401': { description: 设备 token 无效 }
  /api/v1/device/status:
    get:
      tags: [device]
      security: []
      summary: 查询设备实时状态
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/DeviceTokenQuery'
      responses:
        '200': { description: 设备状态 }
        '401': { description: 设备 token 无效 }
  /api/v1/device/film/latest.film:
    get:
      tags: [device]
      security: []
      summary: 下载设备所属最新 film
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/DeviceTokenQuery'
      responses:
        '200': { description: film 文件流 }
        '401': { description: 设备 token 无效 }
        '404': { description: film 不存在 }
  /api/v1/device/film/{filename}:
    get:
      tags: [device]
      security: []
      summary: 按文件名下载设备可访问的 film
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string, maxLength: 96 }
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/DeviceTokenQuery'
      responses:
        '200': { description: film 文件流 }
        '401': { description: 设备 token 无效 }
        '404': { description: film 不存在 }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    CookieSession:
      type: apiKey
      in: cookie
      name: penaup_session
    WereadSkillKey:
      type: apiKey
      in: header
      name: X-Penaup-WeRead-Key
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AlbumId:
      name: albumId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StreamId:
      name: streamId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    StreamItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Profile:
      name: profile
      in: query
      required: false
      schema: { type: string, enum: [PENAUP_STD, PENAUP_PRO, PENAUP_MAX], default: PENAUP_STD }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    DeviceFilter:
      name: device_id
      in: query
      required: false
      schema: { type: string, maxLength: 128 }
    StreamFilter:
      name: stream_id
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    DeviceIdQuery:
      name: device_id
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DeviceTokenQuery:
      name: token
      in: query
      required: false
      schema: { type: string, maxLength: 256 }
    WereadSkillKey:
      name: X-Penaup-WeRead-Key
      in: header
      required: true
      description: 临时微信读书 Skill Key；不得写入 URL、数据库、日志或响应。
      schema:
        type: string
        minLength: 20
        maxLength: 192
        pattern: '^wrk-[A-Za-z0-9_-]{16,160}$'
    DeviceModelQuery:
      name: model
      in: query
      required: false
      schema: { type: string, enum: [PENAUP_STD, PENAUP_PRO, PENAUP_MAX] }
    BatteryQuery:
      name: battery
      in: query
      required: false
      schema: { type: number, minimum: -1, maximum: 100 }
    DeviceStateQuery:
      name: state
      in: query
      required: false
      schema: { type: string, enum: [idle, preparing, transferring, refreshing, succeeded, failed, unknown] }
  schemas:
    WereadSnapshotRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [weekly, monthly]
          default: monthly
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 月报月份；不传时由微信读书返回当前月份。
    WereadSnapshotResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          $ref: '#/components/schemas/WereadSnapshot'
    WereadSnapshot:
      type: object
      required: [source, mode, profile, screen, periodKey, periodLabel, readingDays, readingMinutes, bookCount, noteCount, topBookDetails, dailyReading]
      properties:
        source: { type: string, const: weread }
        mode: { type: string, enum: [weekly, monthly] }
        profile: { type: string, const: PENAUP_PRO }
        screen:
          type: object
          required: [width, height, panel]
          properties:
            width: { type: integer, const: 792 }
            height: { type: integer, const: 528 }
            panel: { type: string, const: E6 3.68 inch }
        periodKey: { type: string }
        periodLabel: { type: string }
        readingDays: { type: integer, minimum: 0 }
        readingMinutes: { type: integer, minimum: 0 }
        bookCount: { type: integer, minimum: 0 }
        noteCount: { type: integer, minimum: 0 }
        topBooks:
          type: array
          maxItems: 8
          items: { type: string }
        topBookDetails:
          type: array
          maxItems: 8
          items:
            type: object
            required: [title, author, readingMinutes, progress]
            properties:
              bookId: { type: string }
              title: { type: string }
              author: { type: string }
              coverUrl: { type: string, format: uri }
              readingMinutes: { type: integer, minimum: 0 }
              progress: { type: integer, minimum: 0, maximum: 100 }
              summary: { type: string }
        dailyReading:
          type: array
          maxItems: 31
          items:
            type: object
            required: [day, readingMinutes]
            properties:
              day: { type: integer, minimum: 1, maximum: 31 }
              readingMinutes: { type: integer, minimum: 0 }
        quote: { type: string }
        fetchedAt: { type: string, format: date-time }
    HealthResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [status, service]
          properties:
            status: { type: string, const: ok }
            service: { type: string, const: penaup-runtime }
            version: { type: string }
            node: { type: string }
            capabilities:
              type: object
              additionalProperties: { type: boolean }
    ReadyResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          properties:
            status: { type: string, const: ready }
            database: { type: string, const: ok }
            media: { type: string, const: writable }
    JsonObject:
      type: object
      additionalProperties: true
    AlbumRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1000 }
        ditherType: { type: string, maxLength: 32, default: adaptive }
        ditherStrength: { type: number, minimum: 0, maximum: 100, default: 80 }
    Album:
      type: object
      required: [id, name, ditherType, ditherStrength]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        coverPhotoId: { type: [integer, 'null'] }
        ditherType: { type: string }
        ditherStrength: { type: number }
        createdAt: { type: string, format: date-time }
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }
    AlbumListResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/Album' }
    Photo:
      type: object
      required: [id, albumId, filename]
      properties:
        id: { type: integer }
        albumId: { type: integer }
        filename: { type: string }
        width: { type: integer }
        height: { type: integer }
        layout: { type: object, additionalProperties: true }
        sort: { type: integer }
        createdAt: { type: string, format: date-time }
        originalUrl: { type: string }
    TemplateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        kind: { type: string, maxLength: 32, default: custom }
        definition: { type: object, additionalProperties: true }
        renderConfig: { type: object, additionalProperties: true }
        thumbPath: { type: string, maxLength: 512 }
    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateRequest'
        - type: object
          properties:
            id: { type: integer }
            userId: { type: integer }
            isBuiltin: { type: boolean }
            createdAt: { type: string, format: date-time }
    StreamRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        mode: { type: string, enum: [device_pull, server_push], default: device_pull }
        enabled: { type: boolean, default: true }
    Stream:
      allOf:
        - $ref: '#/components/schemas/StreamRequest'
        - type: object
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
            items:
              type: array
              items: { $ref: '#/components/schemas/StreamItem' }
    StreamItemRequest:
      type: object
      additionalProperties: true
      properties:
        templateId: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 0 }
        durationSec: { type: integer, minimum: 1 }
        scheduleType: { type: string }
        startAt: { type: string, format: date-time }
        enabled: { type: boolean }
    StreamItem:
      allOf:
        - $ref: '#/components/schemas/StreamItemRequest'
        - type: object
          properties:
            id: { type: integer }
            streamId: { type: integer }
    SortIdsRequest:
      type: object
      description: 相册排序使用 photo_ids，片单排序使用 item_ids；camelCase 别名兼容旧客户端。
      oneOf:
        - required: [photo_ids]
        - required: [photoIds]
        - required: [item_ids]
        - required: [itemIds]
      properties:
        photo_ids:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
        photoIds:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
        item_ids:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
        itemIds:
          type: array
          maxItems: 500
          items: { type: integer, minimum: 1 }
    DeviceIdsRequest:
      type: object
      properties:
        device_ids:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 128 }
        deviceIds:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 128 }
    StreamPushRequest:
      type: object
      properties:
        item_id: { type: integer, minimum: 1 }
        itemId: { type: integer, minimum: 1 }
    ChallengeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        invite_token: { type: string, maxLength: 256 }
    VerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: integer, minimum: 1 }
        code: { type: string, pattern: '^\\d{6}$' }
    ChallengeResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [challenge_id, expires_at]
          properties:
            challenge_id: { type: integer }
            expires_at: { type: string, format: date-time }
    TokenResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [access_token, refresh_token, token_type, expires_at]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { const: Bearer }
            expires_at: { type: string, format: date-time }
            refresh_expires_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { const: true }
        data:
          type: object
          required: [id, email]
          properties:
            id: { type: integer }
            email: { type: string, format: email }
            role: { type: string }
    Device:
      type: object
      required: [deviceId, model, online]
      properties:
        deviceId: { type: string }
        model: { type: string, enum: [PENAUP_STD, PENAUP_PRO, PENAUP_MAX] }
        name: { type: string }
        online: { type: boolean }
        batteryPercent: { type: integer, minimum: 0, maximum: 100 }
        state: { type: string }
    DeviceCommandRequest:
      type: object
      required: [cmd]
      properties:
        cmd: { type: string, maxLength: 128 }
        params: { type: object, additionalProperties: true }
    TransferCreateRequest:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, maxLength: 128 }
        media_id: { type: integer, minimum: 1 }
        card_title: { type: string, maxLength: 128 }
        rendering_detail: { type: string, maxLength: 256 }
    TransferEvent:
      type: object
      required: [transfer_id, device_id, phase, completed_bytes, total_bytes, progress_hint, outcome, updated_at]
      properties:
        transfer_id: { type: string, format: uuid }
        device_id: { type: string }
        phase: { $ref: '#/components/schemas/TransferPhase' }
        completed_bytes: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }
        progress_hint: { type: number, minimum: 0, maximum: 1 }
        outcome: { type: string, enum: [pending, success, failure, uncertain] }
        detail: { type: string }
        updated_at: { type: string, format: date-time }
        card_title: { type: string }
        rendering_detail: { type: string }
    TransferPhase:
      type: string
      enum:
        - idle
        - preparing
        - discovering
        - connecting
        - handshaking
        - transferring
        - refreshing
        - succeeded
        - failed
        - device_state_uncertain
